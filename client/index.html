<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panspermia</title>
    <style>
      /* Design tokens (polish S3): one language for the HUD, the editor, the leaderboard and the cards. Dark glass with
         light ink reads over the bright sand and the deep water alike. */
      :root {
        --glass: rgb(10 30 34 / 0.42); --glass-strong: rgb(10 30 34 / 0.72); --line: rgb(225 245 238 / 0.2);
        --ink: #eef7f2; --ink-soft: rgb(238 247 242 / 0.72); --accent: #9fe7d0; --energy: #f0953a; --dna: #93c24c;
        --evolve: #ffd678; --danger: #ff7a66; --radius: 10px; --font: 13px/1.35 system-ui, sans-serif; --blur: blur(6px);
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #02121a; }
      #hud { position: fixed; inset: 0; pointer-events: none; font: var(--font); color: var(--ink); }
      #hud [hidden] { display: none !important; }
      .hud-panel { position: absolute; top: 12px; left: 12px; width: 190px; padding: 9px 11px 10px; display: grid; gap: 6px;
        background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius); backdrop-filter: var(--blur);
        text-shadow: 0 1px 2px rgb(0 0 0 / 0.5); }
      .hud-name { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-weight: 600; }
      .hud-name .species { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .hud-name small, .hud-label { color: var(--ink-soft); font-weight: 400; font-size: 11px; }
      .hud-row { display: grid; gap: 3px; position: relative; }
      .gain { position: absolute; right: 0; top: -2px; font-weight: 700; font-size: 12px; pointer-events: none;
        text-shadow: 0 1px 2px rgb(0 0 0 / 0.6); animation: gain 1.4s ease-out forwards; }
      .gain.energy { color: var(--energy); }
      .gain.dna { color: var(--dna); }
      @keyframes gain { 0% { opacity: 0; transform: translateY(4px) scale(0.8); } 15% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-14px); } }
      /* A part discovered (hud.ts unlock): a card drops in, its icon in a turning DNA-green ring with sparks, then rises away. */
      .unlock { position: fixed; top: 64px; left: 50%; display: flex; gap: 14px; align-items: center; padding: 10px 20px 10px 12px;
        border-radius: 16px; background: var(--glass-strong); border: 1px solid color-mix(in srgb, var(--dna) 55%, transparent);
        box-shadow: 0 0 24px color-mix(in srgb, var(--dna) 30%, transparent); backdrop-filter: var(--blur); pointer-events: none;
        animation: unlock-in 0.55s cubic-bezier(0.2, 1.6, 0.4, 1) both, unlock-out 0.5s ease-in 3.1s forwards; }
      .unlock-icon { position: relative; width: 64px; height: 64px; display: grid; place-items: center; }
      .unlock-icon img { width: 56px; height: 56px; border-radius: 50%; animation: unlock-pop 0.6s 0.2s both; }
      .unlock-icon b { font-size: 26px; color: var(--dna); }
      .unlock-icon .ring { position: absolute; inset: -4px; border-radius: 50%; animation: spin 2.4s linear infinite;
        background: conic-gradient(var(--dna), transparent 30%, var(--dna) 50%, transparent 80%, var(--dna));
        -webkit-mask: radial-gradient(closest-side, transparent 86%, #000 88%); mask: radial-gradient(closest-side, transparent 86%, #000 88%); }
      .unlock-icon .spark { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%;
        background: #d8f0a8; box-shadow: 0 0 6px var(--dna); opacity: 0; animation: spark 0.9s 0.25s ease-out both;
        transform: rotate(var(--a)) translateY(0); }
      .unlock-text { display: grid; gap: 1px; }
      .unlock-text small { color: var(--ink-soft); font-size: 11px; }
      .unlock-text small:first-child { color: var(--dna); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
      .unlock-text strong { font-size: 18px; }
      @keyframes unlock-in { from { opacity: 0; transform: translate(-50%, -24px) scale(0.8); } to { opacity: 1; transform: translate(-50%, 0); } }
      @keyframes unlock-out { to { opacity: 0; transform: translate(-50%, -18px) scale(0.96); } }
      @keyframes unlock-pop { from { transform: scale(0.2) rotate(-40deg); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spark { 0% { opacity: 1; transform: rotate(var(--a)) translateY(0); } 100% { opacity: 0; transform: rotate(var(--a)) translateY(-46px); } }
      @media (prefers-reduced-motion: reduce) { .unlock, .unlock * { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; } }
      .hud-label b { color: var(--ink); font-weight: 600; }
      /* Molecule gauges (hud.ts): energy a starch chain in orange, DNA a double helix in mossy green. */
      .molecule { display: block; width: 100%; height: auto; overflow: visible; }
      .molecule path { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .molecule circle { stroke: none; }
      .molecule .track path { stroke: rgb(255 255 255 / 0.15); }
      .molecule .track circle { fill: rgb(255 255 255 / 0.15); }
      .molecule .track .rungs, .molecule .lit .rungs { stroke-width: 1; }
      .molecule.energy .lit path { stroke: var(--energy); }
      .molecule.energy .lit circle { fill: #ffd2a1; }
      .molecule.dna .lit path { stroke: var(--dna); }
      .molecule.dna .lit .rungs { stroke: #cfe8a6; opacity: 0.75; }
      .molecule .lit { transition: filter 0.4s; }
      .molecule.energy.full .lit { filter: drop-shadow(0 0 2.5px var(--energy)); }
      .molecule.dna.ready .lit { filter: drop-shadow(0 0 3px var(--dna)); animation: dna-ready 1.6s ease-in-out infinite alternate; }
      @keyframes dna-ready { to { filter: drop-shadow(0 0 6px var(--dna)) brightness(1.25); } }
      .children { display: flex; flex-wrap: wrap; gap: 3px; min-height: 14px; align-items: center; }
      .children svg { width: 20px; height: 20px; fill: rgb(238 247 242 / 0.22); stroke: var(--ink); stroke-width: 1.2; }
      .children svg .in { fill: none; stroke-width: 1; opacity: 0.8; }
      .children small { color: var(--danger); font-size: 11px; }
      .hud-bottom { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: grid; justify-items: center; gap: 8px; }
      .hud-status:not(:empty) { padding: 4px 12px; border-radius: 999px; background: var(--glass); backdrop-filter: var(--blur);
        border: 1px solid var(--line); color: var(--ink); font-size: 12px; letter-spacing: 0.02em; }
      .hud-abilities { display: flex; gap: 10px; }
      .chip { --p: 100%; position: relative; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
        background: conic-gradient(var(--accent) var(--p), rgb(255 255 255 / 0.12) 0) border-box; }
      .chip::before { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--glass-strong); }
      .chip span { position: relative; font-size: 16px; line-height: 1; opacity: 0.55; }
      .chip small { position: absolute; bottom: -15px; font-size: 10px; color: var(--ink-soft); }
      .chip.ready span { opacity: 1; }
      .chip.active { background: var(--evolve); }
      .chip.active span { opacity: 1; }
      .hud-toasts { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; }
      .toast { padding: 6px 14px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--line);
        backdrop-filter: var(--blur); animation: toast 4.5s ease forwards; white-space: nowrap; }
      @keyframes toast { 0% { opacity: 0; transform: translateY(-6px); } 8%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; } }
      .hud-message { position: absolute; inset: 0; display: grid; place-content: center; font-size: 16px; color: var(--ink-soft); }
      .hud-vignette { position: absolute; inset: 0; opacity: 0; transition: opacity 0.3s;
        background: radial-gradient(ellipse at center, transparent 55%, rgb(190 30 20 / 0.55) 100%); }
      .hud-perf { position: absolute; left: 12px; bottom: 8px; font: 11px ui-monospace, monospace; color: var(--ink-soft); }
      @media (prefers-reduced-motion: reduce) { .toast { animation-duration: 0.01s; animation-delay: 4s; } }
      #extinct { position: fixed; inset: 0; display: grid; place-content: center; gap: 16px; text-align: center;
        background: rgb(4 18 22 / 0.55); backdrop-filter: var(--blur); font: 18px system-ui, sans-serif; color: var(--ink); }
      #extinct[hidden] { display: none; }
      #extinct button { justify-self: center; font: inherit; padding: 10px 20px; border: 1px solid var(--accent); border-radius: var(--radius);
        background: var(--glass-strong); color: inherit; cursor: pointer; }
      #extinct button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      /* The editor: same tokens as the HUD. Two glass panels, a parts grid of icons, swatches, handles on the body. */
      #editor { position: fixed; inset: 0; pointer-events: none; font: var(--font); color: var(--ink); }
      #editor[hidden], #editor [hidden] { display: none !important; }
      #editor .panel { position: absolute; top: 52px; pointer-events: auto; padding: 12px; box-sizing: border-box;
        background: var(--glass-strong); border: 1px solid var(--line); border-radius: var(--radius); backdrop-filter: var(--blur); }
      #palette { left: 12px; width: 232px; }
      /* No scrollbars: the columns have no max-height; the editor zooms each one down to fit the window (queueFit). */
      #editor .ed-side { position: absolute; top: 60px; right: 12px; width: 232px; display: grid; gap: 8px; align-content: start; pointer-events: auto; }
      #editor .ed-side .panel { position: static; display: grid; gap: 8px; }
      /* The DNA budget, top right: a helix, what is left, and what this design costs (red) or refunds (green). */
      #editor .ed-dna { position: absolute; top: 8px; right: 12px; display: flex; align-items: center; gap: 8px; padding: 5px 14px 5px 10px;
        border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--line); backdrop-filter: var(--blur); pointer-events: auto; }
      #editor .ed-dna svg { width: 14px; height: 26px; fill: none; stroke-linecap: round; }
      #editor .ed-dna .strand { stroke: var(--dna); stroke-width: 1.8; }
      #editor .ed-dna .pair { stroke: #cfe8a6; stroke-width: 1.1; opacity: 0.8; }
      #editor .ed-dna b { font-size: 20px; color: var(--dna); font-variant-numeric: tabular-nums; }
      #editor .ed-dna.short b { color: var(--danger); }
      #editor .dna-spend { font-weight: 700; font-size: 15px; color: var(--danger); font-variant-numeric: tabular-nums; }
      #editor .dna-spend.refund { color: var(--dna); }
      #editor .ed-side h2 { margin: 0; }
      #editor .kids-note { color: var(--ink-soft); font-size: 12px; }
      #editor .kids-note b { color: var(--ink); } #editor .kids-note b.cost { color: var(--danger); }
      #editor h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--ink-soft); letter-spacing: 0.04em; text-transform: uppercase; }
      #editor .parts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
      #editor .part-group + .part-group { margin-top: 8px; }
      #editor .part-group h3 { margin: 0 0 4px; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
      #editor .part .click-badge { position: absolute; bottom: 2px; right: 3px; font-size: 9px; font-weight: 700; padding: 0 3px;
        border-radius: 4px; background: var(--accent); color: #0b1f1a; }
      /* The click box: which active parts each mouse button triggers in this design. */
      #editor .clicks { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 10px;
        padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: rgb(255 255 255 / 0.04); }
      #editor .clicks svg { width: 20px; height: 28px; fill: none; stroke: var(--ink-soft); stroke-width: 1.2; }
      #editor .clicks .btn { fill: rgb(255 255 255 / 0.06); stroke: none; }
      #editor .clicks.has-left .btn.left, #editor .clicks.has-right .btn.right { fill: var(--accent); }
      #editor .click { display: grid; gap: 1px; font-size: 11px; min-width: 0; }
      #editor .click small { color: var(--ink-soft); font-size: 10px; }
      #editor .click span { overflow-wrap: anywhere; }
      #editor .part { position: relative; aspect-ratio: 1; padding: 0; border-radius: 8px; cursor: grab; touch-action: none;
        background: rgb(143 179 166 / 0.55); border: 1px solid var(--line); overflow: hidden; }
      #editor .part img { width: 100%; height: 100%; display: block; pointer-events: none; }
      #editor .part .price { position: absolute; top: 3px; right: 4px; font-size: 10px; font-weight: 600; padding: 0 4px;
        border-radius: 6px; background: var(--glass-strong); color: var(--dna); }
      #editor .part .pips { position: absolute; bottom: 2px; left: 0; right: 0; font-size: 8px; letter-spacing: 1px; color: var(--ink); text-shadow: 0 1px 2px #000; }
      #editor .part .coat { position: absolute; top: 3px; left: 4px; font-size: 9px; color: var(--ink-soft); }
      #editor .part.used { border-color: var(--accent); }
      #editor .part.locked { cursor: default; background: rgb(255 255 255 / 0.04); }
      #editor .part .q { font-size: 20px; color: var(--ink-soft); opacity: 0.6; }
      /* A part's tooltip: a glass card beside the tile (the design language of the panels). */
      #editor .part-tip { position: fixed; left: 0; top: 0; z-index: 5; width: 230px; padding: 10px 12px; display: grid; gap: 6px;
        background: var(--glass-strong); border: 1px solid var(--line); border-radius: var(--radius); backdrop-filter: var(--blur);
        box-shadow: 0 6px 20px rgb(0 0 0 / 0.35); pointer-events: none; }
      #editor .part-tip strong { font-size: 14px; }
      #editor .part-tip p { color: var(--ink-soft); font-size: 12px; line-height: 1.35; }
      #editor .tip-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 12px; font-variant-numeric: tabular-nums; }
      #editor .tip-row small { color: var(--ink-soft); font-size: 10px; margin-left: 1px; }
      #editor .tip-row svg { width: 12px; height: 16px; vertical-align: -3px; margin-right: 3px; fill: none; }
      #editor .tip-dna { color: var(--dna); font-weight: 600; }
      #editor .tip-dna .strand { stroke: var(--dna); stroke-width: 1.8; }
      #editor .tip-dna .pair { stroke: #cfe8a6; stroke-width: 1.1; }
      #editor .tip-upkeep { color: var(--energy); font-weight: 600; }
      #editor .tip-upkeep svg { width: 13px; height: 13px; fill: rgb(240 149 58 / 0.25); stroke: var(--energy); stroke-width: 1.2; }
      #editor .tip-copies { color: var(--ink-soft); }
      #editor .part-tip .click-badge { position: static; }
      #editor button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); border-radius: 8px;
        background: rgb(255 255 255 / 0.06); padding: 6px 10px; }
      #editor button:hover:not(:disabled) { background: rgb(255 255 255 / 0.12); }
      #editor button:disabled { opacity: 0.4; cursor: default; }
      #editor button:focus-visible, #editor .handle:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      #editor .icon { width: 34px; height: 34px; padding: 4px; display: inline-grid; place-items: center; }
      #editor .icon svg { width: 22px; height: 22px; fill: rgb(238 247 242 / 0.2); stroke: var(--ink); stroke-width: 1.2; }
      #editor .icon svg .ink { fill: var(--ink); stroke: none; }
      #editor .icon svg .line { fill: none; }
      #editor [aria-pressed='true'], #editor [aria-checked='true'] { border-color: var(--accent); background: rgb(159 231 208 / 0.18); }
      #editor .name { font: 600 15px/1.2 system-ui, sans-serif; color: var(--ink); background: rgb(255 255 255 / 0.06);
        border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; box-sizing: border-box; }
      #editor p { margin: 0; }
      #editor .ed-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      #editor .swatch { width: 24px; height: 24px; padding: 0; border-radius: 50%; background: var(--c); border: 2px solid rgb(0 0 0 / 0.25); }
      #editor .swatch[aria-checked='true'] { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); background: var(--c); }
      #editor .plans:empty { display: none; }
      #editor .kids { gap: 4px; }
      #editor .eggs { display: flex; flex-wrap: wrap; gap: 2px; flex: 1; min-height: 16px; }
      #editor .eggs svg { width: 15px; height: 15px; fill: rgb(238 247 242 / 0.15); stroke: var(--ink-soft); stroke-width: 1.1; }
      #editor .eggs svg.new { fill: rgb(240 199 94 / 0.45); stroke: var(--energy); }
      #editor .eggs svg .in { fill: none; }
      #editor .stats { display: flex; gap: 14px; color: var(--ink-soft); font-size: 12px; }
      #editor .stat { display: inline-flex; align-items: center; gap: 4px; }
      #editor .stat b { color: var(--ink); font-variant-numeric: tabular-nums; }
      #editor .stat svg { width: 16px; height: 16px; fill: rgb(238 247 242 / 0.25); stroke: var(--ink-soft); stroke-width: 1.1; }
      #editor .stat svg .empty { fill: none; stroke-dasharray: 2 1.5; }
      #editor .stat.full b { color: var(--danger); }
      #editor .stat.upkeep svg { fill: rgb(240 149 58 / 0.25); stroke: var(--energy); }
      #editor .stat.upkeep svg .o { fill: #ffd2a1; stroke: none; }
      #editor .stat.upkeep b { color: var(--energy); }
      #editor .message { color: var(--danger); font-size: 12px; }
      #editor .message:empty { display: none; }
      #editor .primary { font-size: 15px; font-weight: 600; padding: 10px; background: rgb(159 231 208 / 0.22); border-color: var(--accent); }
      #editor .evolution { display: grid; gap: 6px; }
      #editor .evolve:not(:disabled) { background: rgb(255 214 120 / 0.22); border-color: var(--evolve); color: #ffe6a8; }
      /* The countdown: the seconds inside a ring that empties. */
      #editor .ed-clock { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center;
        padding: 4px 14px 4px 5px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--line);
        backdrop-filter: var(--blur); white-space: nowrap; }
      #editor .ed-clock .dial { position: relative; width: 40px; height: 40px; }
      #editor .ed-clock svg { width: 40px; height: 40px; display: block; }
      #editor .ed-clock .dial .secs { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; }
      #editor .ed-clock .track { fill: rgb(255 255 255 / 0.06); stroke: var(--line); stroke-width: 3; }
      #editor .ed-clock .left { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 100; transform: rotate(-90deg);
        transform-origin: 20px 20px; transition: stroke-dashoffset 0.25s linear; }
      #editor .ed-clock .secs { font-variant-numeric: tabular-nums; line-height: 1; }
      #editor .ed-clock .what { color: var(--ink-soft); font-size: 11px; }
      #editor .ed-clock.late .left { stroke: var(--danger); }
      #editor .ed-clock.late .secs { color: var(--danger); }
      #editor .ed-help { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); color: var(--ink-soft); font-size: 12px;
        text-shadow: 0 1px 2px rgb(0 0 0 / 0.5); white-space: nowrap; }
      /* Sculpting handles, colour-coded: length amber, width cyan, bend magenta (the help line is the legend). */
      #editor .h-length { --h: #f2b84b; }
      #editor .h-width { --h: #57d2f2; }
      #editor .h-bend { --h: #e27ad8; }
      #editor .handle { position: fixed; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; pointer-events: auto;
        cursor: grab; touch-action: none; background: var(--h); border: 2px solid var(--glass-strong);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--h) 45%, transparent); }
      #editor .handle:hover { box-shadow: 0 0 0 5px color-mix(in srgb, var(--h) 65%, transparent); }
      #editor .handle.small { width: 13px; height: 13px; left: -6.5px; top: -6.5px; }
      #editor .key { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--h); margin-left: 6px; vertical-align: -1px; }
      #editor .drag-ghost { position: fixed; left: -32px; top: -32px; width: 64px; height: 64px; pointer-events: none; opacity: 0.85; }
      @media (max-width: 760px) { #palette, #editor .ed-side { width: 40%; } #editor .ed-help { display: none; } }
      #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      #labels div { position: absolute; left: 0; top: 0; font: 12px system-ui, sans-serif; color: rgb(220 245 240 / 0.8);
        white-space: nowrap; text-shadow: 0 1px 3px #000; will-change: transform; }
      #labels .self { color: #fff; font-weight: 600; }
      /* Phase colours (labels.ts): who to hunt, who to flee — bacteria blue, eukaryotes yellow, plankton orange, animals red. */
      :root { --t1: #8fd3ff; --t2: #f5e27a; --t3: #ffa45c; --t4: #ff6f6f; }
      #labels .tier-1 { color: var(--t1); } #labels .tier-2 { color: var(--t2); }
      #labels .tier-3 { color: var(--t3); } #labels .tier-4 { color: var(--t4); }
      #leaders { position: fixed; top: 12px; right: 58px; margin: 0; padding: 8px 12px 8px 28px; min-width: 140px;
        font: var(--font); font-size: 12px; color: var(--ink-soft); background: var(--glass); border: 1px solid var(--line);
        border-radius: var(--radius); backdrop-filter: var(--blur); pointer-events: none; }
      #leaders li { white-space: nowrap; }
      #leaders .self { color: #fff; font-weight: 600; }
      #leaders i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: var(--ink-soft); }
      #leaders .tier-1 i { background: var(--t1); } #leaders .tier-2 i { background: var(--t2); }
      #leaders .tier-3 i { background: var(--t3); } #leaders .tier-4 i { background: var(--t4); }
      #leaders .gold span, #leaders .silver span, #leaders .bronze span { font-weight: 700; }
      #leaders .gold span { color: #ffd34d; } #leaders .silver span { color: #dfe6ec; } #leaders .bronze span { color: #e0955a; }
      /* Fullscreen, beside the ranking. */
      .fullscreen { position: fixed; top: 12px; right: 12px; width: 38px; height: 38px; padding: 0; display: grid; place-items: center;
        border-radius: var(--radius); background: var(--glass); border: 1px solid var(--line); backdrop-filter: var(--blur);
        color: var(--ink); cursor: pointer; pointer-events: auto; }
      .fullscreen:hover { background: var(--glass-strong); }
      .fullscreen:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      .fullscreen svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; transition: transform 0.2s; }
      .fullscreen.on svg { transform: scale(-1); }
      #stageup { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none;
        font: 600 34px system-ui, sans-serif; color: #ffe6a8; text-shadow: 0 2px 12px rgb(0 0 0 / 0.7); opacity: 0; transition: opacity 1.5s; }
      #stageup small { display: block; font-size: 17px; font-weight: 400; color: var(--ink); margin-top: 8px; }
      #stageup.on { opacity: 1; }
      #card { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; padding: 16px;
        background: rgb(4 18 22 / 0.6); backdrop-filter: var(--blur); font: 15px system-ui, sans-serif; color: var(--ink); }
      #card[hidden] { display: none; }
      #card img { width: min(900px, 92vw); border-radius: 12px; box-shadow: 0 8px 40px #000; }
      #card .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      #card button, #card a { font: inherit; color: inherit; text-decoration: none; padding: 9px 16px; cursor: pointer;
        border: 1px solid var(--accent); border-radius: var(--radius); background: var(--glass-strong); }
      #card button:focus-visible, #card a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="labels" aria-hidden="true"></div>
    <ol id="leaders" aria-label="Most energy"></ol>
    <div id="editor" hidden></div>
    <div id="stageup" role="status"></div>
    <div id="card" role="dialog" aria-label="Species card" hidden>
      <img alt="">
      <div class="actions">
        <a class="download" download="species-card.png">Download image</a>
        <button type="button" class="copy">Copy link</button>
        <button type="button" class="primary"></button>
      </div>
    </div>
    <div id="extinct" role="alertdialog" aria-labelledby="extinct-why" hidden>
      <p id="extinct-why"></p>
      <button type="button" class="found">Found a new species</button>
      <button type="button" class="show-card">Species card</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
