<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panspermia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" />
    <style>
      /* Design tokens (polish S3): one language for the HUD, the editor, the leaderboard and the cards. Dark glass with
         light ink reads over the bright sand and the deep water alike. */
      :root {
        --glass: rgb(10 30 34 / 0.42); --glass-strong: rgb(10 30 34 / 0.72); --line: rgb(225 245 238 / 0.2);
        --ink: #eef7f2; --ink-soft: rgb(238 247 242 / 0.72); --accent: #9fe7d0; --energy: #f0953a; --dna: #93c24c;
        --evolve: #ffd678; --danger: #ff7a66; --radius: 10px; --font: 13px/1.35 system-ui, sans-serif; --blur: blur(6px);
        /* Panels (user direction: epurate, scientific): thin dark glass and a hairline — no bevel, no rim. */
        --panel: rgb(6 22 28 / 0.6); --panel-radius: 14px; --panel-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.09), 0 8px 24px rgb(0 0 0 / 0.22);
        --well: rgb(255 255 255 / 0.04); --well-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.08);
        --label: 600 10px/1.2 system-ui, sans-serif; /* small caps labels: uppercase, wide tracking */
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #02121a; }
      #hud { position: fixed; inset: 0; pointer-events: none; font: var(--font); color: var(--ink); }
      #hud [hidden] { display: none !important; }
      .hud-panel { position: absolute; top: 16px; left: 18px; width: 190px; display: grid; gap: 10px; text-shadow: 0 1px 3px rgb(0 0 0 / 0.7);
        filter: drop-shadow(0 1px 2px rgb(0 0 0 / 0.45)); }
      .hud-row { gap: 4px; }
      .hud-gen { font-size: 15px; font-weight: 600; letter-spacing: 0.16em; color: #fff; }
      .hud-label { display: flex; justify-content: space-between; font: var(--label); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); }
      .hud-row { display: grid; gap: 3px; position: relative; }
      .gain { position: absolute; right: 0; top: -2px; font-weight: 700; font-size: 12px; pointer-events: none;
        text-shadow: 0 1px 2px rgb(0 0 0 / 0.6); animation: gain 1.4s ease-out forwards; }
      .gain.energy { color: var(--energy); }
      .gain.dna { color: var(--dna); }
      @keyframes gain { 0% { opacity: 0; transform: translateY(4px) scale(0.8); } 15% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-14px); } }
      /* A part discovered (hud.ts unlock): a card drops in, its icon in a turning DNA-green ring with sparks, then rises away. */
      .unlock { position: fixed; top: 64px; left: 50%; display: flex; gap: 14px; align-items: center; padding: 10px 20px 10px 12px;
        border-radius: 16px; background: var(--glass-strong); border: 1px solid color-mix(in srgb, var(--dna) 55%, transparent);
        box-shadow: 0 0 24px color-mix(in srgb, var(--dna) 30%, transparent); backdrop-filter: var(--blur); pointer-events: none;
        animation: unlock-in 0.55s cubic-bezier(0.2, 1.6, 0.4, 1) both, unlock-out 0.5s ease-in 3.1s forwards; }
      .unlock-icon { position: relative; width: 64px; height: 64px; display: grid; place-items: center; }
      .unlock-icon img { width: 56px; height: 56px; border-radius: 50%; animation: unlock-pop 0.6s 0.2s both; }
      .unlock-icon b { font-size: 26px; color: var(--dna); }
      .unlock-icon .ring { position: absolute; inset: -4px; border-radius: 50%; animation: spin 2.4s linear infinite;
        background: conic-gradient(var(--dna), transparent 30%, var(--dna) 50%, transparent 80%, var(--dna));
        -webkit-mask: radial-gradient(closest-side, transparent 86%, #000 88%); mask: radial-gradient(closest-side, transparent 86%, #000 88%); }
      .unlock-icon .spark { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; margin: -2.5px; border-radius: 50%;
        background: #d8f0a8; box-shadow: 0 0 6px var(--dna); opacity: 0; animation: spark 0.9s 0.25s ease-out both;
        transform: rotate(var(--a)) translateY(0); }
      .unlock-text { display: grid; gap: 1px; }
      .unlock-text small { color: var(--ink-soft); font-size: 11px; }
      .unlock-text small:first-child { color: var(--dna); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
      .unlock-text strong { font-size: 18px; }
      @keyframes unlock-in { from { opacity: 0; transform: translate(-50%, -24px) scale(0.8); } to { opacity: 1; transform: translate(-50%, 0); } }
      @keyframes unlock-out { to { opacity: 0; transform: translate(-50%, -18px) scale(0.96); } }
      @keyframes unlock-pop { from { transform: scale(0.2) rotate(-40deg); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spark { 0% { opacity: 1; transform: rotate(var(--a)) translateY(0); } 100% { opacity: 0; transform: rotate(var(--a)) translateY(-46px); } }
      @media (prefers-reduced-motion: reduce) { .unlock, .unlock * { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; } }
      .hud-label b { color: var(--ink); font-size: 11px; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
      /* Molecule gauges (hud.ts): energy a starch chain in orange, DNA a double helix in mossy green. */
      .molecule { display: block; width: 100%; height: auto; overflow: visible; }
      .molecule path { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .molecule circle { stroke: none; }
      .molecule .track path { stroke: rgb(255 255 255 / 0.18); }
      .molecule .track circle { fill: rgb(255 255 255 / 0.18); }
      .molecule .track .rungs, .molecule .lit .rungs { stroke-width: 1; }
      .molecule.energy .lit path { stroke: var(--energy); }
      .molecule.energy .lit circle { fill: #ffd2a1; }
      .molecule.dna .lit path { stroke: var(--dna); }
      .molecule.dna .lit .rungs { stroke: #cfe8a6; opacity: 0.75; }
      .molecule .lit { transition: filter 0.4s; }
      .molecule.energy.full .lit { filter: drop-shadow(0 0 2.5px var(--energy)); }
      .molecule.dna.ready .lit { filter: drop-shadow(0 0 3px var(--dna)); animation: dna-ready 1.6s ease-in-out infinite alternate; }
      @keyframes dna-ready { to { filter: drop-shadow(0 0 6px var(--dna)) brightness(1.25); } }
      .children { display: flex; gap: 5px; min-height: 8px; align-items: center; }
      .life { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.5); }
      .children small { color: var(--danger); font-size: 11px; }
      .hud-bottom { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: grid; justify-items: center; gap: 8px; }
      .hud-status:not(:empty) { padding: 4px 12px; border-radius: 999px; background: var(--glass); backdrop-filter: var(--blur);
        border: 1px solid var(--line); color: var(--ink); font-size: 12px; letter-spacing: 0.02em; }
      .hud-abilities { display: flex; gap: 10px; }
      .chip { --p: 100%; position: relative; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
        background: conic-gradient(var(--accent) var(--p), rgb(255 255 255 / 0.12) 0) border-box; }
      .chip::before { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--glass-strong); }
      .chip span { position: relative; font-size: 16px; line-height: 1; opacity: 0.55; }
      .chip small { position: absolute; bottom: -15px; font-size: 10px; color: var(--ink-soft); }
      .chip.ready span { opacity: 1; }
      .chip.active { background: var(--evolve); }
      .chip.active span { opacity: 1; }
      .hud-toasts { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; }
      .toast { padding: 6px 14px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--line);
        backdrop-filter: var(--blur); animation: toast 4.5s ease forwards; white-space: nowrap; }
      @keyframes toast { 0% { opacity: 0; transform: translateY(-6px); } 8%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; } }
      .hud-message { position: absolute; inset: 0; display: grid; place-content: center; font-size: 16px; color: var(--ink-soft); }
      .hud-vignette { position: absolute; inset: 0; opacity: 0; transition: opacity 0.3s;
        background: radial-gradient(ellipse at center, transparent 55%, rgb(190 30 20 / 0.55) 100%); }
      .hud-perf { position: absolute; left: 12px; bottom: 8px; font: 11px ui-monospace, monospace; color: var(--ink-soft); }
      @media (prefers-reduced-motion: reduce) { .toast { animation-duration: 0.01s; animation-delay: 4s; } }
      /* The editor: same tokens as the HUD. Two glass panels, a parts grid of icons, swatches, handles on the body. */
      #editor { position: fixed; inset: 0; pointer-events: none; font: var(--font); color: var(--ink); }
      #editor[hidden], #editor [hidden] { display: none !important; }
      #editor .panel { position: absolute; top: 52px; pointer-events: auto; padding: 14px; box-sizing: border-box;
        background: var(--panel); box-shadow: var(--panel-shadow); border-radius: var(--panel-radius); backdrop-filter: var(--blur); }
      #palette { left: 12px; width: 380px; }
      /* No scrollbars: the columns have no max-height; the editor zooms each one down to fit the window (queueFit). */
      #editor .ed-side { position: absolute; top: 64px; right: 12px; width: 280px; display: grid; gap: 8px; align-content: start; pointer-events: auto; }
      #editor .ed-side .panel { position: static; display: grid; gap: 14px; padding: 16px; }
      /* The DNA budget, top right: a helix, what is left, and what this design costs (red) or refunds (green). */
      #editor .ed-dna { position: absolute; top: 8px; right: 12px; width: 280px; box-sizing: border-box; display: flex; justify-content: center; align-items: center;
        gap: 10px; padding: 6px 16px; border-radius: 999px; background: var(--panel); box-shadow: var(--panel-shadow); backdrop-filter: var(--blur); pointer-events: auto; }
      #editor .ed-dna svg { width: 16px; height: 30px; fill: none; stroke-linecap: round; }
      #editor .ed-dna .strand { stroke: var(--dna); stroke-width: 1.8; }
      #editor .ed-dna .pair { stroke: #cfe8a6; stroke-width: 1.1; opacity: 0.8; }
      #editor .ed-dna b { font-size: 24px; font-weight: 600; color: var(--dna); font-variant-numeric: tabular-nums; }
      #editor .ed-dna.short b { color: var(--danger); }
      #editor .dna-spend { font-weight: 700; font-size: 15px; color: var(--danger); font-variant-numeric: tabular-nums; }
      #editor .dna-spend.refund { color: var(--dna); }
      #editor .ed-side h2 { margin: 0; }
      #editor .kids-note { color: var(--ink-soft); font-size: 13px; }
      #editor .kids-note b { color: var(--ink); } #editor .kids-note b.cost { color: var(--danger); }
      #editor h2 { margin: 0 0 10px; font: var(--label); letter-spacing: 0.2em; color: var(--ink-soft); text-transform: uppercase; }
      #editor .parts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
      #editor .part-group + .part-group { margin-top: 10px; }
      #editor .part-group h3 { margin: 0 0 5px; font: var(--label); font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: rgb(238 247 242 / 0.5); }
      #editor .part .click-badge { position: absolute; bottom: 2px; right: 3px; font-size: 9px; font-weight: 700; padding: 0 3px;
        border-radius: 4px; background: var(--accent); color: #0b1f1a; }
      /* The click box: which active parts each mouse button triggers in this design. */
      #editor .clicks { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; align-items: center; margin-bottom: 10px;
        padding: 8px 10px; border-radius: 14px; background: var(--well); box-shadow: var(--well-shadow); }
      #editor .clicks svg { width: 20px; height: 28px; fill: none; stroke: var(--ink-soft); stroke-width: 1.2; }
      #editor .clicks .btn { fill: rgb(255 255 255 / 0.06); stroke: none; }
      #editor .clicks.has-left .btn.left, #editor .clicks.has-right .btn.right { fill: var(--accent); }
      #editor .click { display: grid; gap: 1px; font-size: 11px; min-width: 0; }
      #editor .click small { color: var(--ink-soft); font-size: 10px; }
      #editor .click span { overflow-wrap: anywhere; }
      #editor .part { position: relative; aspect-ratio: 1; padding: 0; border-radius: 10px; cursor: grab; touch-action: none; border: 0; overflow: hidden;
        background: rgb(160 196 184 / 0.24); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.1); transition: background 0.12s; }
      #editor .part:not(.locked):hover { background: rgb(160 196 184 / 0.36); }
      #editor .part img { width: 100%; height: 100%; display: block; pointer-events: none; }
      #editor .part .price { position: absolute; top: 3px; right: 5px; font-size: 10px; font-weight: 600; color: var(--dna); text-shadow: 0 1px 2px rgb(0 0 0 / 0.8); }
      #editor .part .pips { position: absolute; bottom: 2px; left: 0; right: 0; font-size: 8px; letter-spacing: 1px; color: var(--ink); text-shadow: 0 1px 2px #000; }
      #editor .part .coat { position: absolute; top: 3px; left: 4px; font-size: 9px; color: var(--ink-soft); }
      #editor .part.used { box-shadow: inset 0 0 0 1.5px var(--accent); }
      #editor .part.locked { cursor: default; background: var(--well); box-shadow: var(--well-shadow); }
      #editor .part .q { font-size: 18px; color: var(--ink-soft); opacity: 0.4; }
      /* A part's tooltip: a glass card beside the tile (the design language of the panels). */
      #editor .part-tip { position: fixed; left: 0; top: 0; z-index: 5; width: 240px; padding: 11px 13px; display: grid; gap: 6px;
        background: var(--panel); box-shadow: var(--panel-shadow); border-radius: 14px; backdrop-filter: var(--blur); pointer-events: none; }
      #editor .part-tip strong { font-size: 14px; }
      #editor .part-tip p { color: var(--ink-soft); font-size: 12px; line-height: 1.35; }
      #editor .tip-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 12px; font-variant-numeric: tabular-nums; }
      #editor .tip-row small { color: var(--ink-soft); font-size: 10px; margin-left: 1px; }
      #editor .tip-row svg { width: 12px; height: 16px; vertical-align: -3px; margin-right: 3px; fill: none; }
      #editor .tip-dna { color: var(--dna); font-weight: 600; }
      #editor .tip-dna .strand { stroke: var(--dna); stroke-width: 1.8; }
      #editor .tip-dna .pair { stroke: #cfe8a6; stroke-width: 1.1; }
      #editor .tip-upkeep { color: var(--energy); font-weight: 600; }
      #editor .tip-upkeep svg { width: 13px; height: 13px; fill: rgb(240 149 58 / 0.25); stroke: var(--energy); stroke-width: 1.2; }
      #editor .tip-copies { color: var(--ink-soft); }
      #editor .part-tip .click-badge { position: static; }
      #editor button { font: inherit; color: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 6px 10px;
        background: rgb(255 255 255 / 0.06); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.1); }
      #editor button:hover:not(:disabled) { background: rgb(255 255 255 / 0.12); }
      #editor button:disabled { opacity: 0.4; cursor: default; }
      #editor button:focus-visible, #editor .handle:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      #editor .icon { width: 34px; height: 34px; padding: 4px; display: inline-grid; place-items: center; }
      #editor .icon svg { width: 22px; height: 22px; fill: rgb(238 247 242 / 0.2); stroke: var(--ink); stroke-width: 1.2; }
      #editor .icon svg .ink { fill: var(--ink); stroke: none; }
      #editor .icon svg .line { fill: none; }
      #editor [aria-pressed='true'], #editor [aria-checked='true'] { background: rgb(159 231 208 / 0.14); box-shadow: inset 0 0 0 1.5px var(--accent); }
      #editor .name { font: 600 18px/1.2 system-ui, sans-serif; color: #fff; background: none; border: 0; border-radius: 0; padding: 4px 1px 6px;
        box-shadow: inset 0 -1px 0 rgb(255 255 255 / 0.22); width: 100%; box-sizing: border-box; }
      #editor .name:focus { outline: none; box-shadow: inset 0 -1.5px 0 var(--accent); }
      #editor p { margin: 0; }
      #editor .ed-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      #editor .ed-side .icon { width: 42px; height: 42px; }
      #editor .ed-side .icon svg { width: 26px; height: 26px; }
      #editor .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px 6px; justify-items: center; }
      #editor .swatch { width: 26px; height: 26px; padding: 0; border-radius: 50%; background: var(--c); border: 0; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.25); }
      #editor .swatch[aria-checked='true'] { box-shadow: 0 0 0 2px #0a2228, 0 0 0 3.5px var(--ink); background: var(--c); }
      #editor .plans:empty { display: none; }
      #editor .kids { gap: 8px; }
      #editor .eggs { display: flex; flex-wrap: wrap; gap: 2px; flex: 1; min-height: 16px; }
      #editor .eggs svg { width: 19px; height: 19px; fill: rgb(238 247 242 / 0.15); stroke: var(--ink-soft); stroke-width: 1.1; }
      #editor .eggs svg.new { fill: rgb(240 199 94 / 0.45); stroke: var(--energy); }
      #editor .eggs svg .in { fill: none; }
      #editor .stats { display: flex; gap: 20px; color: var(--ink-soft); font-size: 14px; }
      #editor .stat { display: inline-flex; align-items: center; gap: 6px; }
      #editor .stat b { color: var(--ink); font-variant-numeric: tabular-nums; }
      #editor .stat svg { width: 20px; height: 20px; fill: rgb(238 247 242 / 0.25); stroke: var(--ink-soft); stroke-width: 1.1; }
      #editor .stat svg .empty { fill: none; stroke-dasharray: 2 1.5; }
      #editor .stat.full b { color: var(--danger); }
      #editor .stat.upkeep svg { fill: rgb(240 149 58 / 0.25); stroke: var(--energy); }
      #editor .stat.upkeep svg .o { fill: #ffd2a1; stroke: none; }
      #editor .stat.upkeep b { color: var(--energy); }
      #editor .message { color: var(--danger); font-size: 12px; }
      #editor .message:empty { display: none; }
      /* The two actions, flat pills: hatch in the accent; Evolve in orange, blinking once it is within reach. */
      #editor .primary, #editor .evolve { font-size: 16px; font-weight: 600; letter-spacing: 0.03em; padding: 12px 14px; border-radius: 999px; box-shadow: none; }
      #editor .primary { background: var(--accent); color: #0b1f1a; }
      #editor .primary:hover:not(:disabled) { background: #b8f0de; }
      #editor .primary:active:not(:disabled), #editor .evolve:active:not(:disabled) { scale: 0.98; }
      #editor .evolution { display: grid; gap: 6px; }
      #editor .evolve { background: #ff9a3c; color: #2a1404; }
      #editor .evolve:hover:not(:disabled) { background: #ffad5e; }
      #editor .evolve:disabled { background: rgb(255 255 255 / 0.06); color: var(--ink-soft); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.1); }
      #editor .evolve.ready { animation: evolve-blink 1.1s ease-in-out infinite; }
      @keyframes evolve-blink { 50% { background: #ffb469; box-shadow: 0 0 18px rgb(255 140 40 / 0.75); } }
      @media (prefers-reduced-motion: reduce) { #editor .evolve.ready { animation: none; box-shadow: 0 0 0 2px #ffd0a0; } }
      /* The countdown: the seconds inside a ring that empties. */
      #editor .ed-clock { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center;
        padding: 4px 16px 4px 5px; border-radius: 999px; background: var(--panel); box-shadow: var(--panel-shadow);
        backdrop-filter: var(--blur); white-space: nowrap; }
      #editor .ed-clock .dial { position: relative; width: 40px; height: 40px; }
      #editor .ed-clock svg { width: 40px; height: 40px; display: block; }
      #editor .ed-clock .dial .secs { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; }
      #editor .ed-clock .track { fill: rgb(255 255 255 / 0.06); stroke: var(--line); stroke-width: 3; }
      #editor .ed-clock .left { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 100; transform: rotate(-90deg);
        transform-origin: 20px 20px; transition: stroke-dashoffset 0.25s linear; }
      #editor .ed-clock .secs { font-variant-numeric: tabular-nums; line-height: 1; }
      #editor .ed-clock .what { color: var(--ink); font-size: 15px; font-weight: 500; letter-spacing: 0.02em; }
      #editor .ed-clock.late .left { stroke: var(--danger); }
      #editor .ed-clock.late .secs { color: var(--danger); }
      #editor .ed-help { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); color: var(--ink-soft); font-size: 12px;
        text-shadow: 0 1px 2px rgb(0 0 0 / 0.5); white-space: nowrap; }
      /* Sculpting handles, colour-coded: length amber, width cyan, bend magenta (the help line is the legend). */
      #editor .h-length { --h: #f2b84b; }
      #editor .h-width { --h: #57d2f2; }
      #editor .h-bend { --h: #e27ad8; }
      #editor .handle { position: fixed; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; pointer-events: auto;
        cursor: grab; touch-action: none; background: var(--h); border: 2px solid var(--glass-strong);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--h) 45%, transparent); }
      #editor .handle:hover { box-shadow: 0 0 0 5px color-mix(in srgb, var(--h) 65%, transparent); }
      #editor .handle.small { width: 13px; height: 13px; left: -6.5px; top: -6.5px; }
      #editor .key { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--h); margin-left: 6px; vertical-align: -1px; }
      #editor .drag-ghost { position: fixed; left: -32px; top: -32px; width: 64px; height: 64px; pointer-events: none; opacity: 0.85; }
      @media (max-width: 760px) { #palette, #editor .ed-side { width: 40%; } #editor .ed-help { display: none; } }
      #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      #labels div { position: absolute; left: 0; top: 0; font: 12px system-ui, sans-serif; color: rgb(220 245 240 / 0.8);
        white-space: nowrap; text-shadow: 0 1px 3px #000; will-change: transform; }
      #labels .self { color: #fff; font-weight: 600; }
      /* Phase colours (labels.ts): who to hunt, who to flee — bacteria blue, eukaryotes yellow, plankton orange, animals red. */
      :root { --t1: #8fd3ff; --t2: #f5e27a; --t3: #ffa45c; --t4: #ff6f6f; }
      #labels .tier-1 { color: var(--t1); } #labels .tier-2 { color: var(--t2); }
      #labels .tier-3 { color: var(--t3); } #labels .tier-4 { color: var(--t4); }
      #leaders { position: fixed; top: 14px; right: 16px; margin: 0; padding: 0 0 0 22px; width: 190px; box-sizing: border-box;
        font: var(--font); font-size: 12px; color: var(--ink-soft); pointer-events: none; text-shadow: 0 1px 3px rgb(0 0 0 / 0.75); }
      #leaders li { white-space: nowrap; line-height: 1.55; font-variant-numeric: tabular-nums; }
      #leaders li::marker { color: rgb(238 247 242 / 0.5); font-size: 11px; }
      #leaders span { display: inline-block; max-width: 116px; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }
      /* Our own row: a faint highlight (and its real rank below the top eight), brighter a moment when we climb a place. */
      #leaders .self { color: #fff; font-weight: 600; margin: 1px -6px 1px -22px; padding: 0 6px 0 22px; list-style-position: inside;
        border-radius: 6px; background: rgb(255 255 255 / 0.12); transition: background 0.4s; }
      #leaders .self.up { background: rgb(255 255 255 / 0.26); }
      #leaders .gap { list-style: none; text-align: center; line-height: 0.9; opacity: 0.6; }

      #leaders .tier-1 i { background: var(--t1); } #leaders .tier-2 i { background: var(--t2); }
      #leaders .tier-3 i { background: var(--t3); } #leaders .tier-4 i { background: var(--t4); }
      #leaders .gold span, #leaders .silver span, #leaders .bronze span { font-weight: 700; }
      #leaders .gold span { color: #ffd34d; } #leaders .silver span { color: #dfe6ec; } #leaders .bronze span { color: #e0955a; }
      /* Fullscreen, just left of the ranking (#leaders: 200 px wide at right 12 px). */
      .fullscreen { position: fixed; top: 10px; right: 214px; width: 32px; height: 32px; padding: 0; display: grid; place-items: center; border: 0;
        background: none; color: var(--ink); opacity: 0.75; cursor: pointer; pointer-events: auto; filter: drop-shadow(0 1px 2px rgb(0 0 0 / 0.7)); }
      .fullscreen:hover { opacity: 1; }
      body:has(#editor:not([hidden])) .fullscreen { display: none; } /* the editor's DNA counter sits there */
      .fullscreen:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      .fullscreen svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; transition: transform 0.2s; }
      .fullscreen.on svg { transform: scale(-1); }
      #stageup { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none;
        font: 600 34px system-ui, sans-serif; color: #ffe6a8; text-shadow: 0 2px 12px rgb(0 0 0 / 0.7); opacity: 0; transition: opacity 1.5s; }
      #stageup small { display: block; font-size: 17px; font-weight: 400; color: var(--ink); margin-top: 8px; }
      #stageup.on { opacity: 1; }
      #card { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; padding: 16px;
        background: rgb(4 18 22 / 0.6); backdrop-filter: var(--blur); font: 15px system-ui, sans-serif; color: var(--ink); }
      #card[hidden] { display: none; }
      #card img { width: min(900px, 92vw); border-radius: 12px; box-shadow: 0 8px 40px #000; }
      #card .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      #card button, #card a { font: inherit; color: inherit; text-decoration: none; padding: 9px 16px; cursor: pointer;
        border: 1px solid var(--accent); border-radius: var(--radius); background: var(--glass-strong); }
      #card button:focus-visible, #card a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      /* End of game (user direction): the session's evolution tree, three stats, the Hall of Fame and two buttons, in
         chunky glowing game panels. A win rises in gold (burst, rays, the tree growing to land); an extinction is muted. */
      #ending { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; overflow: hidden; padding: 16px; box-sizing: border-box;
        font-family: system-ui, sans-serif; color: var(--ink); opacity: 0; backdrop-filter: blur(0); transition: opacity 0.8s ease, backdrop-filter 0.8s ease;
        background: radial-gradient(ellipse at 50% 38%, rgb(10 52 60 / 0.5), rgb(2 12 18 / 0.86)); }
      #ending[hidden] { display: none; }
      #ending.in { opacity: 1; backdrop-filter: blur(10px) saturate(1.15); }
      .end-rays, .end-burst { position: absolute; left: 50%; top: 36%; translate: -50% -50%; pointer-events: none; opacity: 0; }
      .end-rays { width: 220vmax; height: 220vmax; mask: radial-gradient(closest-side, #000 8%, transparent 62%);
        background: repeating-conic-gradient(rgb(255 214 120 / 0.14) 0 5deg, transparent 5deg 15deg); }
      .end-burst { width: 46vmin; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, #fff6d4, rgb(255 214 120 / 0.55) 32%, transparent 70%); }
      .win.in .end-rays { animation: end-fade 1.8s 0.15s ease-out forwards, end-spin 90s linear infinite; }
      .win.in .end-burst { animation: end-burst 1.5s ease-out forwards; }
      .end-bubbles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      .end-bubble { position: absolute; bottom: -40px; left: var(--x); width: var(--s); aspect-ratio: 1; border-radius: 50%; opacity: 0;
        border: 1.5px solid rgb(180 240 230 / 0.35); background: radial-gradient(circle at 35% 30%, rgb(255 255 255 / 0.55), transparent 45%); }
      .in .end-bubble { animation: end-rise var(--t) var(--d) linear infinite; }
      .end-panel { position: relative; width: min(1120px, 100%); max-height: 100%; overflow: hidden; box-sizing: border-box; display: grid; gap: 12px; padding: 18px 26px 20px; border-radius: 30px;
        background: linear-gradient(180deg, rgb(28 78 86 / 0.9), rgb(8 34 42 / 0.94)); opacity: 0; translate: 0 44px; scale: 0.92;
        box-shadow: inset 0 2px 0 rgb(255 255 255 / 0.2), inset 0 -8px 20px rgb(0 0 0 / 0.35), 0 0 0 3px rgb(255 214 120 / 0.6),
          0 0 0 7px rgb(60 40 10 / 0.35), 0 26px 70px rgb(0 0 0 / 0.6), 0 0 70px rgb(255 214 120 / 0.2); }
      .extinct .end-panel { box-shadow: inset 0 2px 0 rgb(255 255 255 / 0.14), inset 0 -8px 20px rgb(0 0 0 / 0.35), 0 0 0 3px rgb(170 190 200 / 0.4),
          0 0 0 7px rgb(0 0 0 / 0.25), 0 26px 70px rgb(0 0 0 / 0.6); background: linear-gradient(180deg, rgb(40 58 64 / 0.92), rgb(14 26 32 / 0.95)); }
      .in .end-panel { animation: end-panel 0.9s 0.35s cubic-bezier(0.2, 1.35, 0.4, 1) forwards; }
      .end-title { margin: 0; text-align: center; line-height: 1; }
      .in .end-title { animation: end-title 0.9s 0.6s cubic-bezier(0.2, 1.4, 0.4, 1) both; }
      .end-name { display: block; padding-bottom: 2px; font-size: clamp(26px, 4.2vw, 46px); font-weight: 700; color: transparent; -webkit-background-clip: text; background-clip: text;
        background-image: linear-gradient(180deg, #fff5cc, #ffd678 45%, #e3952a); filter: drop-shadow(0 3px 0 rgb(90 50 0 / 0.6)) drop-shadow(0 0 18px rgb(255 214 120 / 0.4)); }
      .extinct .end-name { background-image: linear-gradient(180deg, #f1f5f6, #b3c2c7 50%, #7d9097); filter: drop-shadow(0 3px 0 rgb(0 0 0 / 0.5)); }
      .end-fate { display: block; margin-top: 4px; font-size: 14px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: var(--evolve); }
      .extinct .end-fate { color: #c7d3d6; }
      .end-box { border-radius: 24px; padding: 8px 10px 12px; background: radial-gradient(ellipse at 50% 0%, rgb(70 150 160 / 0.22), transparent 70%), rgb(3 20 26 / 0.6);
        box-shadow: inset 0 3px 14px rgb(0 0 0 / 0.5), inset 0 0 0 1.5px rgb(159 231 208 / 0.18); }
      .end-tree { display: block; width: 100%; height: auto; overflow: visible; }
      .end-column { fill: color-mix(in srgb, var(--tc) 8%, transparent); stroke: color-mix(in srgb, var(--tc) 22%, transparent); stroke-width: 1.5; }
      .end-tree .t1 { --tc: var(--t1); } .end-tree .t2 { --tc: var(--t2); } .end-tree .t3 { --tc: var(--t3); } .end-tree .t4 { --tc: var(--t4); }
      .end-branch { fill: none; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
      .end-branch.trunk { stroke: url(#end-trunk); stroke-width: 7; filter: drop-shadow(0 0 5px rgb(255 214 120 / 0.45)); }
      .extinct .end-branch.trunk { stroke: rgb(190 205 210 / 0.7); filter: none; }
      .end-branch.dead { stroke: rgb(170 190 195 / 0.42); stroke-width: 3.5; }
      .in .end-branch { animation: end-grow var(--t) var(--d) cubic-bezier(0.45, 0, 0.2, 1) forwards; }
      .end-pop { scale: 0; opacity: 0; }
      .in .end-pop { animation: end-pop 0.6s var(--d) cubic-bezier(0.3, 1.6, 0.5, 1) forwards; }
      .end-bubble-node { fill: url(#end-cell); stroke: var(--tc); stroke-width: 3; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--tc) 70%, transparent)); }
      .end-gloss { fill: none; stroke: rgb(255 255 255 / 0.26); stroke-width: 1.5; }
      .end-ring { fill: none; stroke: var(--tc); stroke-width: 2; stroke-dasharray: 4 5; opacity: 0.8; animation: end-spin 14s linear infinite; }
      .end-node.dead .end-bubble-node { stroke: rgb(170 190 195 / 0.6); filter: none; }
      .end-node.dead .end-img { filter: grayscale(0.85) brightness(0.85); }
      .end-twig { stroke: rgb(170 190 195 / 0.55); stroke-width: 2; stroke-linecap: round; }
      .end-cross { fill: none; stroke: #c9d5d8; stroke-width: 2.2; stroke-linecap: round; }
      .end-cross.big { stroke-width: 3; scale: 1.5; }
      .end-count { font: 600 13px Fredoka, system-ui, sans-serif; fill: #e6f3ee; paint-order: stroke; stroke: rgb(2 16 20 / 0.9); stroke-width: 3.5; }
      .end-badge circle { fill: #213d16; stroke: var(--dna); stroke-width: 2; }
      .end-plus { stroke: var(--dna); stroke-width: 2.5; stroke-linecap: round; }
      .end-node.root circle { fill: #3a2a20; stroke: #ffb36b; stroke-width: 2.5; } .end-node.root .core { fill: #ffcf8a; stroke: none; }
      .end-node.land .end-pop > circle:not(.sun) { fill: #3b2a08; stroke: #ffd678; stroke-width: 3.5; }
      .end-node.land .sun { fill: #ffe9a8; stroke: none; } .end-node.land .hill { fill: #8bbd52; }
      .end-flare { opacity: 0; }
      .in .end-flare { animation: end-flare 1.6s var(--d) ease-out forwards, end-breathe 3s calc(var(--d) + 1.6s) ease-in-out infinite; }
      .end-stats { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 4px; }
      .end-stat { min-width: 140px; padding: 4px 20px 6px; border-radius: 999px; text-align: center;
        background: linear-gradient(180deg, rgb(44 106 114 / 0.95), rgb(14 52 60 / 0.97));
        box-shadow: inset 0 2px 0 rgb(255 255 255 / 0.22), inset 0 -3px 0 rgb(0 0 0 / 0.3), 0 0 0 1.5px rgb(159 231 208 / 0.35), 0 6px 14px rgb(0 0 0 / 0.35); }
      .end-stat b { display: block; font-size: 26px; font-weight: 700; color: #fff; text-shadow: 0 2px 0 rgb(0 0 0 / 0.35); font-variant-numeric: tabular-nums; }
      .end-stat:nth-child(1) b { color: var(--evolve); } .end-stat:nth-child(2) b { color: #b9e07a; } .end-stat:nth-child(3) b { color: #ff9a7a; }
      .end-stat small { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); }
      .in .end-stat { animation: end-in 0.6s calc(2.4s + var(--i, 0) * 0.12s) both; }
      .end-stat:nth-child(2) { --i: 1; } .end-stat:nth-child(3) { --i: 2; }
      .end-halls { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .end-hall { padding: 9px 14px 11px; border-radius: 22px; background: rgb(3 20 26 / 0.6);
        box-shadow: inset 0 0 0 1.5px rgb(159 231 208 / 0.16), inset 0 3px 10px rgb(0 0 0 / 0.35); }
      .end-hall h2 { margin: 0 0 5px; font-size: 16px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--evolve); }
      .end-hall h2::before { content: '\2726  '; }
      .end-hall ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 15px; }
      .end-hall li { display: grid; grid-template-columns: 30px 1fr auto 64px; gap: 12px; align-items: center; padding: 3px 10px; border-radius: 10px; }
      .short .end-hall li:nth-child(n+6):not(.self):not(.gap) { display: none; }
      .end-hall li:nth-child(odd) { background: rgb(255 255 255 / 0.035); }
      .end-hall .rank { font-weight: 700; text-align: center; color: var(--ink-soft); }
      .end-hall li:nth-child(1) .rank { color: #ffd34d; } .end-hall li:nth-child(2) .rank { color: #dfe6ec; } .end-hall li:nth-child(3) .rank { color: #e0955a; }
      .end-hall .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .end-hall .time { font-weight: 600; color: #fff; font-variant-numeric: tabular-nums; }
      .end-hall .gens { color: var(--ink-soft); font-size: 14px; text-align: right; }
      .end-hall li.self { background: rgb(255 214 120 / 0.15); box-shadow: inset 0 0 0 2px var(--evolve), 0 0 16px rgb(255 214 120 / 0.35); color: #fff; }
      .end-hall li.gap, .end-hall li.empty { display: block; text-align: center; color: var(--ink-soft); background: none; }
      .end-hall li.empty { font-size: 14px; padding: 10px; }
      .in .end-hall { animation: end-in 0.7s 2.9s both; } .in .end-hall.all { animation-delay: 3.05s; }
      .in .end-hall li.self { animation: end-glow 1.4s 3.4s ease-in-out 2; }
      .end-actions { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin-top: 2px; }
      .in .end-actions { animation: end-in 0.6s 3.3s both; }
      .end-actions button { font: 700 19px Fredoka, system-ui, sans-serif; letter-spacing: 0.04em; padding: 10px 34px 12px; min-width: 190px; border: 0;
        border-radius: 999px; cursor: pointer; color: #142a2e; transition: translate 0.12s, filter 0.12s, box-shadow 0.12s; }
      .end-again { background: linear-gradient(180deg, #ffe9a6, #ffc54d 55%, #e8932a);
        box-shadow: inset 0 2px 0 rgb(255 255 255 / 0.6), inset 0 -4px 0 rgb(150 80 0 / 0.45), 0 6px 0 #8a4f12, 0 10px 24px rgb(0 0 0 / 0.45), 0 0 26px rgb(255 214 120 / 0.4); }
      .end-share { background: linear-gradient(180deg, #bdf4e5, #6fd3c0 55%, #3aa596);
        box-shadow: inset 0 2px 0 rgb(255 255 255 / 0.55), inset 0 -4px 0 rgb(0 80 70 / 0.45), 0 6px 0 #1f6e64, 0 10px 24px rgb(0 0 0 / 0.45); }
      .end-actions button:hover { translate: 0 -2px; filter: brightness(1.08); }
      .end-actions button:active { translate: 0 5px; box-shadow: inset 0 2px 0 rgb(255 255 255 / 0.4), 0 1px 0 rgb(0 0 0 / 0.5); }
      .end-actions button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
      /* Skipped (a click or a key): the entrance jumps to its end; the slow loops (bubbles, rays, rings) carry on. */
      .settled .end-panel, .settled .end-title, .settled .end-branch, .settled .end-pop, .settled .end-stat, .settled .end-hall,
      .settled .end-actions, .settled .end-burst { animation-delay: 0s !important; animation-duration: 0.01s !important; }
      @keyframes end-fade { to { opacity: 1; } }
      @keyframes end-spin { to { rotate: 360deg; } }
      @keyframes end-burst { 0% { opacity: 0; scale: 0.2; } 18% { opacity: 1; } 100% { opacity: 0; scale: 4; } }
      @keyframes end-rise { 0% { opacity: 0; translate: 0 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; translate: 2vw -110vh; } }
      @keyframes end-panel { to { opacity: 1; translate: 0 0; scale: 1; } }
      @keyframes end-title { from { opacity: 0; scale: 1.35; } to { opacity: 1; scale: 1; } }
      @keyframes end-grow { to { stroke-dashoffset: 0; } }
      @keyframes end-pop { 0% { opacity: 0; scale: 0; } 60% { opacity: 1; scale: 1.18; } 100% { opacity: 1; scale: 1; } }
      @keyframes end-flare { 0% { opacity: 0; scale: 0.3; } 30% { opacity: 1; scale: 1.5; } 100% { opacity: 0.55; scale: 1; } }
      @keyframes end-breathe { 50% { opacity: 0.85; scale: 1.12; } }
      @keyframes end-in { from { opacity: 0; translate: 0 26px; } to { opacity: 1; translate: 0 0; } }
      @keyframes end-glow { 50% { box-shadow: inset 0 0 0 2px var(--evolve), 0 0 28px rgb(255 214 120 / 0.75); } }
      @media (max-width: 760px) { .end-halls { grid-template-columns: 1fr; } .end-panel { padding: 14px 12px 16px; } .end-actions button { min-width: 0; flex: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #ending, #ending * { animation-duration: 0.01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition: none !important; }
        .end-bubbles, .end-rays, .end-burst { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="labels" aria-hidden="true"></div>
    <ol id="leaders" aria-label="Most energy"></ol>

      <img alt="">
      <div class="actions">
        <a class="download" download="species-card.png">Download image</a>
        <button type="button" class="copy">Copy link</button>
        <button type="button" class="primary"></button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
