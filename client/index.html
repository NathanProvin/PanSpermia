<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panspermia</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #02121a; }
      #hud { position: fixed; top: 12px; left: 16px; font: 14px system-ui, sans-serif; color: #9fe7e0; pointer-events: none; }
      #extinct { position: fixed; inset: 0; display: grid; place-content: center; gap: 16px; text-align: center;
        background: rgb(2 18 26 / 0.7); font: 18px system-ui, sans-serif; color: #9fe7e0; }
      #extinct[hidden] { display: none; }
      #extinct button { justify-self: center; font: inherit; padding: 10px 20px; border: 1px solid #9fe7e0; border-radius: 6px;
        background: transparent; color: inherit; cursor: pointer; }
      #extinct button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      #editor { position: fixed; inset: 0; pointer-events: none; font: 14px system-ui, sans-serif; color: #9fe7e0; }
      #editor[hidden] { display: none; }
      #editor .panel { position: absolute; top: 44px; width: 210px; max-height: calc(100% - 60px); overflow: auto;
        pointer-events: auto; padding: 12px; border: 1px solid rgb(159 231 224 / 0.3); border-radius: 8px;
        background: rgb(2 18 26 / 0.75); box-sizing: border-box; scrollbar-color: rgb(159 231 224 / 0.35) transparent; }
      #palette { left: 16px; }
      #editor-side { right: 16px; display: grid; gap: 10px; }
      #editor h2 { margin: 0 0 8px; font-size: 15px; }
      #editor .parts { display: grid; gap: 6px; }
      #editor button { font: inherit; color: inherit; background: rgb(159 231 224 / 0.08); cursor: pointer;
        border: 1px solid rgb(159 231 224 / 0.35); border-radius: 6px; padding: 6px 10px; touch-action: none; }
      #editor .parts button { display: grid; text-align: left; }
      #editor .parts small { opacity: 0.7; }
      #editor button:disabled { opacity: 0.4; cursor: default; }
      #editor button[aria-pressed="true"] { background: rgb(159 231 224 / 0.3); }
      #editor button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      #editor fieldset { border: 1px solid rgb(159 231 224 / 0.2); border-radius: 6px; margin: 0; display: flex; gap: 6px; align-items: center; }
      #editor label { display: grid; gap: 4px; }
      #editor p { margin: 0; }
      #editor .short { color: #ff8a7a; }
      #editor .hatch { font-size: 16px; padding: 10px; background: rgb(159 231 224 / 0.25); }
      @media (max-width: 640px) { #editor .panel { width: 46%; } }
    </style>
  </head>
  <body>
    <div id="hud" role="status">Connecting…</div>
    <div id="editor" hidden></div>
    <div id="extinct" role="alertdialog" aria-labelledby="extinct-why" hidden>
      <p id="extinct-why"></p>
      <button type="button">Found a new species</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
