# Tests on every push and pull request; a push to master that passes them publishes the game's image, which the
# updater in compose.yaml picks up within minutes (deploy/SETUP.md).
name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: image # one publish at a time, in push order
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nathanprovin/panspermia
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker build -t "$IMAGE:latest" -t "$IMAGE:$GITHUB_SHA" .
      - run: docker push "$IMAGE:$GITHUB_SHA" && docker push "$IMAGE:latest"
